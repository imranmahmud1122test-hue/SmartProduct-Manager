<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Smart Product Manager (SPM) | Smart Stock, Smart Business</title>
    <meta name="description" content="SPM - Smart Product Manager | Multi-Tenant Supermarket Inventory, Product Catalog, Barcode/QR, POS & Sales Management Web Platform." />
    <meta property="og:title" content="Smart Product Manager (SPM) | Smart Stock, Smart Business" />
    <meta property="og:description" content="SPM - Smart Product Manager | Multi-Tenant Supermarket Inventory, Product Catalog, Barcode/QR, POS & Sales Management Web Platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @page {
        margin: 8mm;
        size: auto;
      }
      @media print {
        /* When isolated printing is active (receipts, slips, invoices, manifests, audits, catalogs) */
        body.is-printing-isolated #root,
        body.is-printing-isolated > *:not(#spm-print-mount) {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          max-height: 0 !important;
          overflow: hidden !important;
          position: absolute !important;
          left: -9999px !important;
        }
        body.is-printing-isolated {
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }
        body.is-printing-isolated #spm-print-mount {
          display: block !important;
          visibility: visible !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #0f172a !important;
        }

        .no-print,
        [data-no-print] {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: #ffffff !important;
          color: #0f172a !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <div id="spm-print-mount" style="display: none;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
