    <script>
      (function() {
        var isBenignTransportError = function(e) {
          if (!e) return false;
          var str = String(e.message || e.reason?.message || e.reason || e || '');
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('WebChannelConnection') !== -1 ||
            str.indexOf('transport errored') !== -1 ||
            str.indexOf('RPC \'Listen\' stream') !== -1
          );
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignTransportError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isBenignTransportError(event.message) || isBenignTransportError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @page {
        margin: 8mm;
        size: auto;
      }
      @media print {
        /* When isolated printing is active (receipts, slips, invoices, manifests, audits, catalogs) */
        body.is-printing-isolated #root,
        body.is-printing-isolated > *:not(#spm-print-mount) {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          max-height: 0 !important;
          overflow: hidden !important;
          position: absolute !important;
          left: -9999px !important;
        }
        body.is-printing-isolated {
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }
        body.is-printing-isolated #spm-print-mount {
          display: block !important;
          visibility: visible !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #0f172a !important;
        }

        .no-print,
        [data-no-print] {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: #ffffff !important;
          color: #0f172a !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
