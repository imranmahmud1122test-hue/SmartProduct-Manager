# Render.com Deployment Configuration for Smart Product Manager (SPM)
services:
  - type: web
    name: smartproduct-manager
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /robots.txt
        name: X-Robots-Tag
        value: all
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /sitemap.xml
        name: X-Robots-Tag
        value: all
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
